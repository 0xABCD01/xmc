name: 'Go Vulnerability Check'

on:
  schedule:
    # Run daily at 06:00 UTC to catch newly disclosed Go stdlib and module CVEs.
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/govulncheck.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  govulncheck:
    name: 'govulncheck (MODULE.bazel Go SDK)'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Extract Bazel Go SDK version'
        id: 'go-version'
        run: |
          GO_VERSION=$(sed -n 's/^go_sdk\.download(version = "\([^"]*\)")$/\1/p' MODULE.bazel | head -n 1)
          if [ -z "${GO_VERSION}" ]; then
            echo "ERROR: Could not extract go_sdk.download version from MODULE.bazel" >&2
            exit 1
          fi
          echo "Detected Bazel Go SDK version: ${GO_VERSION}"
          echo "version=${GO_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: 'Set up Go'
        uses: 'actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34' # v5.3.0
        with:
          go-version: '${{ steps.go-version.outputs.version }}'
          cache: false

      - name: 'Install govulncheck'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: 'Run govulncheck'
        run: govulncheck ./...
